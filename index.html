<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CRISPR Project Companion</title>
  <meta name="description" content="Videos, images, methods and references accompanying our CRISPR-Cas poster.">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="preview-banner" class="preview-banner" hidden>Preview of your unsaved draft. Visitors don't see this version.</div>

  <header class="hero" id="top">
    <div class="wrap">
      <span class="badge" data-bind="meta.badge"></span>
      <h1 data-bind="meta.title"></h1>
      <p class="subtitle" data-bind="meta.subtitle"></p>
      <p class="course" data-bind="meta.course"></p>
      <div class="exp-cards" id="exp-cards"></div>
      <figure class="hero-media" id="hero-media"></figure>
    </div>
  </header>

  <nav class="toc" aria-label="Sections">
    <div class="wrap toc-inner" id="toc"></div>
  </nav>

  <main>
    <section id="overview" class="wrap section">
      <h2 data-bind="overview.heading"></h2>
      <div class="prose" id="overview-body"></div>
    </section>

    <div id="experiments"></div>

    <section id="team" class="wrap section">
      <h2>About us</h2>
      <div class="authors" id="authors"></div>
      <div class="prose ack" id="ack"></div>
    </section>

    <section id="references" class="wrap section">
      <h2>References</h2>
      <ol class="refs" id="refs"></ol>
    </section>
  </main>

  <footer class="wrap footer">
    <p><span data-bind="meta.course"></span> · <span data-bind="meta.date"></span></p>
  </footer>

  <dialog id="lightbox" class="lightbox" aria-label="Enlarged image">
    <button class="lb-close" aria-label="Close">×</button>
    <img alt="">
    <p class="lb-cap"></p>
  </dialog>

  <script>window.Prism = { manual: true };</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-r.min.js"></script>
  <script src="common.js"></script>
  <script src="site.js"></script>
</body>
</html>
